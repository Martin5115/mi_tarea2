<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora WEB — Tarea 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --page-bg: #E7E1D2;
    --page-bg-2: #DAD2BC;
    --chassis: #2E2B27;
    --chassis-edge: #1B1917;
    --chassis-highlight: #3C3833;
    --screen-bg: #C7E2BC;
    --screen-bg-2: #B9D8AC;
    --screen-text: #21391D;
    --screen-sub: #4C6B45;
    --tape-bg: #F6F1E4;
    --tape-edge: #DCD3BB;
    --tape-text: #2E2B27;
    --tape-sub: #8A8271;
    --amber: #E3A63E;
    --amber-dark: #B9812A;
    --red: #B5473A;
    --red-dark: #8C382E;
    --btn-dark: #3E3A35;
    --btn-dark-hi: #4B4640;
    --btn-text: #F3EEE1;
    --shadow-soft: rgba(0,0,0,0.28);
    --focus-ring: #E3A63E;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #131210;
      --page-bg-2: #0C0B0A;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #131210;
    --page-bg-2: #0C0B0A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, var(--page-bg-2), var(--page-bg) 70%);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  .desk {
    width: 100%;
    max-width: 640px;
  }

  .desk-label {
    text-align: center;
    color: #8A8271;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    margin-bottom: 18px;
  }

  .device {
    display: flex;
    gap: 18px;
    align-items: stretch;
  }

  .calculator {
    flex: 0 0 300px;
    background: linear-gradient(160deg, var(--chassis-highlight), var(--chassis) 55%, var(--chassis-edge));
    border-radius: 22px;
    padding: 18px;
    box-shadow:
      0 18px 40px var(--shadow-soft),
      inset 0 1px 0 rgba(255,255,255,0.06);
    position: relative;
  }

  .calculator::before,
  .calculator::after {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #55504A, #16140F);
    top: 12px;
  }
  .calculator::before { left: 12px; }
  .calculator::after { right: 12px; }

  .screen {
    background: linear-gradient(175deg, var(--screen-bg), var(--screen-bg-2));
    border-radius: 12px;
    padding: 16px 16px 12px;
    margin-bottom: 16px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.35);
    min-height: 84px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  .screen-expression {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 0.9rem;
    color: var(--screen-sub);
    min-height: 1.2em;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .screen-display {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-weight: 700;
    font-size: 2.4rem;
    color: var(--screen-text);
    text-align: right;
    line-height: 1.15;
    word-break: break-all;
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 56px);
    gap: 10px;
    grid-template-areas:
      "ac  del div mul"
      "n7  n8  n9  sub"
      "n4  n5  n6  add"
      "n1  n2  n3  eq"
      "n0  n0  dot eq";
  }

  button.key {
    border: none;
    border-radius: 12px;
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--btn-text);
    background: linear-gradient(180deg, var(--btn-dark-hi), var(--btn-dark));
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    cursor: pointer;
    transition: transform 0.05s ease, box-shadow 0.05s ease;
  }
  button.key:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
  }
  button.key:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 2px;
  }

  button.key.op {
    background: linear-gradient(180deg, #EDB959, var(--amber));
    color: #2E2016;
    box-shadow: 0 3px 0 var(--amber-dark), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  button.key.op:active { box-shadow: 0 1px 0 var(--amber-dark), inset 0 1px 0 rgba(255,255,255,0.25); }
  button.key.op.active-op {
    background: linear-gradient(180deg, #2E2016, #241a12);
    color: var(--amber);
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
  }

  button.key.clear {
    background: linear-gradient(180deg, #C6584A, var(--red));
    box-shadow: 0 3px 0 var(--red-dark), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  button.key.clear:active { box-shadow: 0 1px 0 var(--red-dark), inset 0 1px 0 rgba(255,255,255,0.2); }

  button.key.eq {
    background: linear-gradient(180deg, #EDB959, var(--amber));
    color: #2E2016;
    box-shadow: 0 3px 0 var(--amber-dark), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  button.key.eq:active { box-shadow: 0 1px 0 var(--amber-dark), inset 0 1px 0 rgba(255,255,255,0.25); }

  .k-ac  { grid-area: ac; }
  .k-del { grid-area: del; }
  .k-div { grid-area: div; }
  .k-mul { grid-area: mul; }
  .k-7   { grid-area: n7; }
  .k-8   { grid-area: n8; }
  .k-9   { grid-area: n9; }
  .k-sub { grid-area: sub; }
  .k-4   { grid-area: n4; }
  .k-5   { grid-area: n5; }
  .k-6   { grid-area: n6; }
  .k-add { grid-area: add; }
  .k-1   { grid-area: n1; }
  .k-2   { grid-area: n2; }
  .k-3   { grid-area: n3; }
  .k-eq  { grid-area: eq; }
  .k-0   { grid-area: n0; }
  .k-dot { grid-area: dot; }

  .plate {
    text-align: center;
    color: #77705F;
    font-size: 0.7rem;
    font-style: italic;
    margin-top: 14px;
    letter-spacing: 0.01em;
  }

  .tape {
    flex: 1 1 auto;
    min-width: 0;
    background: var(--tape-bg);
    border-radius: 4px 4px 14px 14px;
    box-shadow: 0 14px 30px var(--shadow-soft);
    display: flex;
    flex-direction: column;
    max-height: 420px;
    position: relative;
  }
  .tape::before {
    content: "";
    display: block;
    height: 10px;
    background:
      radial-gradient(circle at 8px 5px, transparent 4px, var(--page-bg) 4.5px) top left,
      radial-gradient(circle at 8px 5px, transparent 4px, var(--page-bg) 4.5px) top right;
    background-size: 20px 10px;
    background-repeat: repeat-x;
    background-color: var(--tape-bg);
    border-radius: 4px 4px 0 0;
  }

  .tape-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px 8px;
    border-bottom: 1px dashed var(--tape-edge);
  }

  .tape-title {
    font-size: 0.78rem;
    color: var(--tape-sub);
    font-weight: 700;
  }

  .tape-clear {
    border: none;
    background: transparent;
    color: var(--red);
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 0.78rem;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .tape-clear:hover { background: rgba(181,71,58,0.1); }
  .tape-clear:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }

  .tape-roll {
    overflow-y: auto;
    padding: 10px 14px 16px;
    flex: 1 1 auto;
  }

  .tape-empty {
    color: var(--tape-sub);
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 0.82rem;
    text-align: center;
    padding: 24px 6px;
  }

  .tape-row {
    font-family: 'Space Mono', 'Courier New', monospace;
    padding: 7px 0;
    border-bottom: 1px dotted var(--tape-edge);
  }
  .tape-row:last-child { border-bottom: none; }

  .tape-expr {
    font-size: 0.78rem;
    color: var(--tape-sub);
  }

  .tape-result {
    font-size: 1.05rem;
    color: var(--tape-text);
    font-weight: 700;
  }

  @media (max-width: 640px) {
    .device { flex-direction: column; }
    .calculator { flex: none; width: 100%; max-width: 340px; margin: 0 auto; }
    .tape { max-height: 220px; width: 100%; max-width: 340px; margin: 0 auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    button.key { transition: none; }
  }
</style>
</head>
<body>

<div class="desk">
  <div class="desk-label">Tarea 2 — Calculadora WEB · HTML5 + JavaScript (ES5) + CSS3</div>

  <div class="device">
    <div class="calculator">
      <div class="screen">
        <div class="screen-expression" id="expression"></div>
        <div class="screen-display" id="display">0</div>
      </div>

      <div class="keypad">
        <button class="key clear k-ac" id="btnAC" type="button">AC</button>
        <button class="key k-del" id="btnDel" type="button">⌫</button>
        <button class="key op k-div" data-op="/" type="button">÷</button>
        <button class="key op k-mul" data-op="*" type="button">×</button>

        <button class="key k-7" data-digit="7" type="button">7</button>
        <button class="key k-8" data-digit="8" type="button">8</button>
        <button class="key k-9" data-digit="9" type="button">9</button>
        <button class="key op k-sub" data-op="-" type="button">−</button>

        <button class="key k-4" data-digit="4" type="button">4</button>
        <button class="key k-5" data-digit="5" type="button">5</button>
        <button class="key k-6" data-digit="6" type="button">6</button>
        <button class="key op k-add" data-op="+" type="button">+</button>

        <button class="key k-1" data-digit="1" type="button">1</button>
        <button class="key k-2" data-digit="2" type="button">2</button>
        <button class="key k-3" data-digit="3" type="button">3</button>
        <button class="key eq k-eq" id="btnEq" type="button">=</button>

        <button class="key k-0" data-digit="0" type="button">0</button>
        <button class="key k-dot" id="btnDot" type="button">.</button>
      </div>

      <div class="plate">sumadora de escritorio · historial persistente</div>
    </div>

    <div class="tape">
      <div class="tape-header">
        <span class="tape-title">CINTA DE HISTORIAL</span>
        <button class="tape-clear" id="clearTape" type="button">Borrar cinta</button>
      </div>
      <div class="tape-roll" id="tapeList"></div>
    </div>
  </div>
</div>

<script>
  // Calculadora WEB - Tarea 2
  // HTML5 + JavaScript ES5 + CSS3
  // Historial de operaciones persistido con localStorage

  var display = document.getElementById('display');
  var exprDisplay = document.getElementById('expression');
  var tapeList = document.getElementById('tapeList');

  var currentValue = '0';
  var previousValue = null;
  var pendingOperator = null;
  var waitingForNewValue = false;

  var HISTORY_KEY = 'itla_calc_historial';

  function loadHistory() {
    var raw;
    try {
      raw = localStorage.getItem(HISTORY_KEY);
    } catch (e) {
      raw = null;
    }
    if (!raw) { return []; }
    try {
      return JSON.parse(raw);
    } catch (e2) {
      return [];
    }
  }

  function saveHistory(history) {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    } catch (e) {
      // almacenamiento no disponible; se ignora silenciosamente
    }
  }

  function renderHistory() {
    var history = loadHistory();
    tapeList.innerHTML = '';

    if (history.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'tape-empty';
      empty.textContent = 'Sin cálculos todavía';
      tapeList.appendChild(empty);
      return;
    }

    var i;
    for (i = history.length - 1; i >= 0; i = i - 1) {
      var entry = history[i];
      var row = document.createElement('div');
      row.className = 'tape-row';

      var exprEl = document.createElement('div');
      exprEl.className = 'tape-expr';
      exprEl.textContent = entry.expression;

      var resEl = document.createElement('div');
      resEl.className = 'tape-result';
      resEl.textContent = '= ' + entry.result;

      row.appendChild(exprEl);
      row.appendChild(resEl);
      tapeList.appendChild(row);
    }
  }

  function addToHistory(expression, result) {
    var history = loadHistory();
    history.push({ expression: expression, result: result });
    saveHistory(history);
    renderHistory();
  }

  function operatorSymbol(op) {
    if (op === '+') { return '+'; }
    if (op === '-') { return '−'; }
    if (op === '*') { return '×'; }
    if (op === '/') { return '÷'; }
    return '';
  }

  function formatNumber(num) {
    var n = parseFloat(num);
    if (isNaN(n)) { return '0'; }
    var str = String(n);
    if (str.length > 12) {
      str = n.toPrecision(10);
      str = parseFloat(str).toString();
    }
    return str;
  }

  function updateOperatorHighlight() {
    var opButtons = document.querySelectorAll('button.key.op');
    var i;
    for (i = 0; i < opButtons.length; i = i + 1) {
      opButtons[i].classList.remove('active-op');
    }
    if (pendingOperator !== null && waitingForNewValue) {
      var active = document.querySelector('button.key.op[data-op="' + pendingOperator + '"]');
      if (active) { active.classList.add('active-op'); }
    }
  }

  function updateDisplay() {
    display.textContent = currentValue;
    if (pendingOperator !== null && previousValue !== null) {
      exprDisplay.textContent = formatNumber(previousValue) + ' ' + operatorSymbol(pendingOperator);
    } else {
      exprDisplay.textContent = '';
    }
    updateOperatorHighlight();
  }

  function inputDigit(digit) {
    if (currentValue === 'Error') {
      currentValue = '0';
    }
    if (waitingForNewValue) {
      currentValue = digit;
      waitingForNewValue = false;
    } else {
      currentValue = currentValue === '0' ? digit : currentValue + digit;
    }
    updateDisplay();
  }

  function inputDecimal() {
    if (currentValue === 'Error') {
      currentValue = '0';
      waitingForNewValue = false;
    }
    if (waitingForNewValue) {
      currentValue = '0.';
      waitingForNewValue = false;
      updateDisplay();
      return;
    }
    if (currentValue.indexOf('.') === -1) {
      currentValue = currentValue + '.';
    }
    updateDisplay();
  }

  function clearAll() {
    currentValue = '0';
    previousValue = null;
    pendingOperator = null;
    waitingForNewValue = false;
    updateDisplay();
  }

  function backspace() {
    if (waitingForNewValue || currentValue === 'Error') { return; }
    if (currentValue.length > 1) {
      currentValue = currentValue.substring(0, currentValue.length - 1);
    } else {
      currentValue = '0';
    }
    updateDisplay();
  }

  function calculate(a, b, op) {
    a = parseFloat(a);
    b = parseFloat(b);
    var result;
    if (op === '+') {
      result = a + b;
    } else if (op === '-') {
      result = a - b;
    } else if (op === '*') {
      result = a * b;
    } else if (op === '/') {
      result = b === 0 ? NaN : a / b;
    } else {
      result = b;
    }
    return result;
  }

  function chooseOperator(op) {
    if (currentValue === 'Error') {
      clearAll();
      return;
    }
    if (pendingOperator !== null && !waitingForNewValue) {
      var result = calculate(previousValue, currentValue, pendingOperator);
      if (isNaN(result)) {
        currentValue = 'Error';
        previousValue = null;
        pendingOperator = null;
        waitingForNewValue = true;
        updateDisplay();
        return;
      }
      previousValue = result;
      currentValue = formatNumber(result);
    } else {
      previousValue = parseFloat(currentValue);
    }
    pendingOperator = op;
    waitingForNewValue = true;
    updateDisplay();
  }

  function equals() {
    if (pendingOperator === null || previousValue === null || currentValue === 'Error') { return; }
    var a = previousValue;
    var b = parseFloat(currentValue);
    var op = pendingOperator;
    var result = calculate(a, b, op);
    var expression = formatNumber(a) + ' ' + operatorSymbol(op) + ' ' + formatNumber(b);

    if (isNaN(result)) {
      currentValue = 'Error';
      exprDisplay.textContent = expression + ' =';
      addToHistory(expression, 'Error (÷0)');
    } else {
      var resultStr = formatNumber(result);
      currentValue = resultStr;
      addToHistory(expression, resultStr);
    }

    previousValue = null;
    pendingOperator = null;
    waitingForNewValue = true;
    updateDisplay();
  }

  // --- Conexión de botones ---

  var digitButtons = document.querySelectorAll('button[data-digit]');
  var i;
  for (i = 0; i < digitButtons.length; i = i + 1) {
    digitButtons[i].addEventListener('click', function (event) {
      inputDigit(event.currentTarget.getAttribute('data-digit'));
    });
  }

  var opButtons = document.querySelectorAll('button[data-op]');
  for (i = 0; i < opButtons.length; i = i + 1) {
    opButtons[i].addEventListener('click', function (event) {
      chooseOperator(event.currentTarget.getAttribute('data-op'));
    });
  }

  document.getElementById('btnDot').addEventListener('click', inputDecimal);
  document.getElementById('btnAC').addEventListener('click', clearAll);
  document.getElementById('btnDel').addEventListener('click', backspace);
  document.getElementById('btnEq').addEventListener('click', equals);

  document.getElementById('clearTape').addEventListener('click', function () {
    saveHistory([]);
    renderHistory();
  });

  // --- Soporte de teclado ---
  document.addEventListener('keydown', function (event) {
    var key = event.key;
    if (key >= '0' && key <= '9') {
      inputDigit(key);
    } else if (key === '.') {
      inputDecimal();
    } else if (key === '+' || key === '-' || key === '*' || key === '/') {
      chooseOperator(key);
    } else if (key === 'Enter' || key === '=') {
      event.preventDefault();
      equals();
    } else if (key === 'Backspace') {
      backspace();
    } else if (key === 'Escape') {
      clearAll();
    }
  });

  // --- Inicialización ---
  renderHistory();
  updateDisplay();
</script>

</body>
</html>
